name: Research regression tests
on: [push, pull_request]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install research test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils
      - run: uv run --frozen --all-extras pytest -q
