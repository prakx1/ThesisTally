<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="905" viewBox="0 0 1024 905" role="img" aria-labelledby="title desc">
  <title id="title">ThesisTally architecture</title>
  <desc id="desc">Dated NSE market data feeds two paths. Swing observations and walk-forward replay share signal, sizing and fill rules. Observations write the paper call journal for the terminal and optional private alerts. Historical replay and discovery produce reports and a hypothesis register. Frozen A126 has a separate paper service and ledger. Independently, a collector archives original NSE and BSE results filings and their publication times. Kite supplies read-only quotes and historical cross-checks. All trades are simulated.</desc>
  <defs>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill:#173337}
      .headline {font-family: Georgia, "Times New Roman", serif; font-size:44px; font-weight:bold}
      .eyebrow {font-size:14px; font-weight:700; letter-spacing:1.5px; fill:#42645e}
      .head {font-size:26px; font-weight:700}
      .node {font-size:21px; font-weight:700}
      .body {font-size:18px; fill:#354f51}
      .small {font-size:16px; fill:#3e5556}
      .route {fill:none; stroke:#496863; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
      .branch {fill:none; stroke:#496863; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1024" height="905" rx="16" fill="#fbfaf6"/>
  <text x="36" y="51" class="headline">ThesisTally architecture</text>
  <text x="38" y="84" class="body">From exchange records to paper trades and research evidence.</text>

  <rect x="36" y="110" width="952" height="113" rx="12" fill="#e4efea" stroke="#bacec5"/>
  <text x="56" y="138" class="eyebrow">MARKET INPUTS</text>
  <text x="56" y="172" class="head">NSE session archive</text>
  <text x="56" y="202" class="body">Daily prices, dated index members and corporate actions</text>
  <path d="M638 130v73" stroke="#a0bdb0"/>
  <text x="664" y="165" class="node">Optional Kite market data</text>
  <text x="664" y="191" class="small">Read-only quotes and history checks</text>

  <!-- The branches originate on the NSE side of the input box. -->
  <path d="M482 224v22" class="branch"/>
  <path d="M482 246H324v20" class="route"/>
  <path d="M482 246h330v20" class="route"/>
  <circle cx="482" cy="246" r="3.7" fill="#496863"/>

  <rect x="36" y="274" width="582" height="402" rx="14" fill="#fff" stroke="#bad1ca" stroke-width="1.6"/>
  <text x="56" y="306" class="eyebrow">SWING STRATEGIES</text>
  <text x="56" y="340" class="head">Shared signals, sizing and fills</text>
  <text x="56" y="370" class="body">The same rules process observations and historical replay.</text>
  <path d="M326 383v16" class="branch"/>
  <path d="M326 399H186v20" class="route"/>
  <path d="M326 399h143v20" class="route"/>

  <rect x="54" y="429" width="263" height="220" rx="9" fill="#edf5f0"/>
  <text x="68" y="461" class="node">Forward observations</text>
  <text x="68" y="493" class="body">Append-only call journal</text>
  <text x="68" y="518" class="small">Plans, fills and daily marks</text>
  <path d="M69 540h230" stroke="#bed3c9"/>
  <text x="68" y="571" class="node">Terminal</text>
  <text x="68" y="597" class="small">Calls and paper trades</text>
  <text x="68" y="621" class="small">Optional private alerts</text>

  <rect x="331" y="429" width="269" height="220" rx="9" fill="#edf3f6"/>
  <text x="346" y="461" class="node">Walk-forward replay</text>
  <text x="346" y="493" class="body">Funded and equal-risk</text>
  <text x="346" y="518" class="small">books in dated test windows</text>
  <path d="M346 540h238" stroke="#c4d4da"/>
  <text x="346" y="571" class="node">Research &amp; discovery</text>
  <text x="346" y="597" class="small">Reports, qualification and</text>
  <text x="346" y="621" class="small">the hypothesis register</text>

  <rect x="636" y="274" width="352" height="402" rx="14" fill="#fff" stroke="#d5c6a5" stroke-width="1.6"/>
  <text x="657" y="306" class="eyebrow" style="fill:#795f24">FROZEN STRATEGY</text>
  <text x="657" y="340" class="head">A126 paper service</text>
  <text x="657" y="370" class="body">Rank monthly on certified data.</text>
  <text x="657" y="397" class="body">Fill at the next open. Mark daily.</text>
  <path d="M812 407v32" class="route"/>

  <rect x="655" y="449" width="314" height="110" rx="9" fill="#f7f1e4"/>
  <text x="672" y="482" class="node">Dedicated paper ledger</text>
  <text x="672" y="512" class="small">Positions, fills, costs and</text>
  <text x="672" y="537" class="small">end-of-session equity</text>
  <path d="M812 561v28" class="route"/>
  <text x="657" y="617" class="node">radar report --since-freeze</text>
  <text x="657" y="644" class="small">Versus the Nifty 200 total-return index</text>

  <rect x="36" y="711" width="952" height="139" rx="13" fill="#f1f1eb" stroke="#cbd1c4"/>
  <text x="56" y="742" class="eyebrow">INDEPENDENT RESULTS-FILING SERVICE</text>
  <text x="56" y="779" class="node">NSE and BSE</text>
  <text x="56" y="808" class="small">Company announcements</text>
  <path d="M269 785h40" class="route"/>
  <text x="329" y="779" class="node">Forward collector</text>
  <text x="329" y="808" class="small">Polls for new filings</text>
  <path d="M529 785h45" class="route"/>
  <text x="593" y="779" class="node">Dated filing archive</text>
  <text x="593" y="808" class="small">Original XBRL, announcement time</text>
  <text x="593" y="829" class="small">and first XBRL publication time</text>

  <g fill="none" stroke="#496863" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="m318 260 6 6 6-6 M806 260l6 6 6-6"/>
    <path d="m180 413 6 6 6-6 M463 413l6 6 6-6"/>
    <path d="m806 433 6 6 6-6 M806 583l6 6 6-6"/>
    <path d="m303 779 6 6-6 6 M568 779l6 6-6 6"/>
  </g>
  <circle cx="44" cy="877" r="5" fill="#2a7565"/>
  <text x="59" y="883" class="small">Execution is paper-only. Broker access reads market data.</text>
</svg>
